services:
  api:
    build: .
    ports: ["127.0.0.1:8001:8001"]
    environment:
      ROUTELAB_API_TOKEN: ${ROUTELAB_API_TOKEN:?Set a random ROUTELAB_API_TOKEN}
    volumes:
      - runtime:/app/data/runtime
      - models:/app/artifacts
    command: >-
      sh -c "uv run --no-sync routelab seed-demo && uv run --no-sync routelab train --dataset demo &&
      exec uv run --no-sync uvicorn routelab.api.app:app --host 0.0.0.0 --port 8001"
  dashboard:
    build: .
    ports: ["127.0.0.1:8502:8502"]
    depends_on: [api]
    environment:
      ROUTELAB_API_URL: http://api:8001
      ROUTELAB_API_TOKEN: ${ROUTELAB_API_TOKEN:?Set a random ROUTELAB_API_TOKEN}
    volumes:
      - runtime:/app/data/runtime:ro
      - models:/app/artifacts:ro
    command: uv run --no-sync streamlit run apps/dashboard.py --server.address 0.0.0.0 --server.port 8502
volumes:
  runtime:
  models:
