name: Quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run routelab seed-demo
      - run: uv run routelab validate-data
      - run: uv run routelab train --dataset demo
      - run: uv run routelab evaluate --dataset demo
      - run: uv run routelab report --dataset demo
