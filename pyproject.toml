[project]
name = "adaptive-llm-router"
version = "0.1.0"
description = "Learned LLM routing with leakage-controlled retrospective benchmark evaluation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "pydantic-settings>=2.8", "httpx>=0.28",
  "numpy>=2.2", "pandas>=2.2", "scikit-learn>=1.6", "scipy>=1.15", "joblib>=1.4",
  "matplotlib>=3.10", "pyarrow>=19", "huggingface-hub>=0.30",
  "streamlit>=1.45", "typer>=0.15",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.11"]

[project.scripts]
routelab = "routelab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routelab"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=routelab --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
omit = ["*/cli.py"]
